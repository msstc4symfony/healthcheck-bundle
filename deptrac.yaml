# Canonical layers of the msstc4symfony bundle standard (stage B spec, section 2).
# Copy as-is; replace the BundleRoot value with ^<bundle class>$ (deptrac reads an unanchored regex: anchors and
# doubled backslashes, e.g. ^Msstc4Symfony\\FooBundle\\FooBundle$).
# A bundle may drop dependencies from the ruleset, never add them.
deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: ^Msstc4Symfony\\HealthCheckBundle\\HealthCheckBundle$

    ruleset:
        # Check contracts, the run actions, decorators, DTOs and events.
        Application: ~

        # Checkers probing external systems (DBAL, Redis, Kafka, ...) implement Application contracts.
        Infrastructure:
            - Application

        # HTTP controller and console commands.
        Presentation:
            - Application

        # Detectors and passes register and decorate checkers by class.
        DependencyInjection:
            - Application
            - Infrastructure

        BundleRoot:
            - Application
            - DependencyInjection
