name: Code Quality Checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  standard:
    uses: msstc4symfony/bundle-standard/.github/workflows/php-bundle.yml@v1.8.0
    with:
      slug: msstc4symfony/healthcheck-bundle
      # Every checker's client extension, so no checker test is skipped in CI.
      extensions: 'mbstring, xml, ctype, iconv, intl, redis, mongodb, memcache, memcached, rdkafka'
      # Measured MSI 76.5 % (= covered MSI) on 2026-10-02 UTC, minus a margin for noise.
      infection-min-msi: 72
      infection-min-covered-msi: 72
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
