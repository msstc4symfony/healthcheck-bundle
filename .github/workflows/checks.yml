name: Code Quality Checks

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - LICENSE
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - LICENSE

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PHP_VERSION: '8.4'
  COMPOSER: composer-ci.json

jobs:
  setup:
    name: Install dependencies
    runs-on: ubuntu-latest
    outputs:
      vendor-cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: none
          tools: composer:v2

      - id: cache-key
        run: echo "value=vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer-ci.lock') }}" >> "$GITHUB_OUTPUT"

      - id: vendor-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ steps.cache-key.outputs.value }}

      - if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

  lint:
    name: PHP lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor-cache-key }}

      - run: find ./src ./tests -name '*.php' | xargs -r -P4 -n50 php -l

  phpstan:
    name: PHPStan
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl, redis, mongodb, memcache, memcached
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor-cache-key }}

      - uses: actions/cache@v5
        with:
          path: /tmp/phpstan
          key: phpstan-${{ hashFiles('composer-ci.lock', 'phpstan*.neon') }}
          restore-keys: |
            phpstan-

      - run: vendor/bin/phpstan analyse --memory-limit=512M -c phpstan-ci.neon

  cs-fixer:
    name: PHP-CS-Fixer
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor-cache-key }}

      - uses: actions/cache@v5
        with:
          path: .php-cs-fixer.cache
          key: cs-fixer-${{ hashFiles('.php-cs-fixer.dist.php', 'composer-ci.lock') }}

      - run: vendor/bin/php-cs-fixer check

  rector:
    name: Rector
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor-cache-key }}

      - uses: actions/cache@v5
        with:
          path: /tmp/rector
          key: rector-${{ hashFiles('rector.php', 'composer-ci.lock') }}

      - run: vendor/bin/rector process -n

  composer-audit:
    name: Composer validate + audit
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor-cache-key }}

      - run: composer validate --strict --no-check-publish

      - run: composer audit

  phpunit:
    name: PHPUnit (Symfony ${{ matrix.symfony.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony:
          - version: '6.4.*'
            label: '6.4'
            codecov: false
          - version: '7.*'
            label: '7'
            codecov: false
          - version: '8.*'
            label: '8'
            codecov: true
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: xdebug
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-symfony${{ matrix.symfony.label }}-${{ hashFiles('composer-ci.json') }}
          restore-keys: |
            vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-symfony${{ matrix.symfony.label }}-

      - name: Pin Symfony version
        env:
          SYMFONY_VERSION: ${{ matrix.symfony.version }}
        run: |
          composer require --no-update --no-interaction \
            "symfony/framework-bundle:${SYMFONY_VERSION}" \
            "symfony/http-foundation:${SYMFONY_VERSION}" \
            "symfony/console:${SYMFONY_VERSION}"

      - name: Resolve dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - run: XDEBUG_MODE=coverage vendor/bin/phpunit --coverage-clover=coverage.xml --log-junit junit.xml

      - if: ${{ matrix.symfony.codecov && !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: phpunit
          fail_ci_if_error: true
          slug: max-shamaev-php/healthcheck-bundle
          token: ${{ secrets.CODECOV_TOKEN }}

      - if: ${{ matrix.symfony.codecov && !cancelled() }}
        uses: codecov/codecov-action@v6
        with:
          report_type: test_results
          flags: phpunit
          fail_ci_if_error: true
          slug: max-shamaev-php/healthcheck-bundle
          token: ${{ secrets.CODECOV_TOKEN }}

  infection:
    # Mutation testing — informational only at this stage (no MSI threshold).
    # Runs on push-to-main to keep PR feedback fast; ~10s on this codebase but
    # may grow with src/.
    name: Infection (mutation testing)
    needs: setup
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, iconv, intl
          coverage: xdebug
          tools: composer:v2

      - uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ needs.setup.outputs.vendor-cache-key }}

      - run: XDEBUG_MODE=coverage vendor/bin/infection --threads=$(nproc) --no-interaction --logger-github

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: infection-report
          path: var/infection/
          if-no-files-found: ignore
          retention-days: 14
